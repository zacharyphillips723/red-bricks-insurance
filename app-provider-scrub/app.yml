command:
  - uvicorn
  - main:app
  - --host=0.0.0.0
  - --port=8000
env:
  - name: LAKEBASE_PROJECT_ID
    value: red-bricks-insurance
  - name: LAKEBASE_DATABASE_NAME
    value: denial_scrub
  - name: LAKEBASE_BRANCH
    value: production
  - name: SQL_WAREHOUSE_ID
    value: auto
  - name: LLM_ENDPOINT
    value: databricks-llama-4-maverick
  - name: SCRUB_AGENT_ENDPOINT
    value: databricks-claude-haiku-4-5
  - name: DENIAL_ENDPOINT
    value: denial-risk-scorer
  - name: VS_ENDPOINT
    value: red-bricks-vs-endpoint
  - name: UC_CATALOG
    value: auto
  - name: UC_SCHEMA
    value: claims
