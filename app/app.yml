command:
  - uvicorn
  - main:app
  - --host=0.0.0.0
  - --port=8000

# SQL_WAREHOUSE_ID and UC_CATALOG default to "auto" (runtime auto-detection).
# When deployed via `databricks bundle deploy`, the DAB resource config
# (resources/app.yml) overrides with resolved values. Catalog is always red_bricks_insurance.
env:
  - name: APP_STATE_SCHEMA
    value: app_state
  - name: GENIE_SPACE_ID
    value: auto
  - name: SQL_WAREHOUSE_ID
    value: auto
  - name: LLM_ENDPOINT
    value: databricks-llama-4-maverick
  - name: UC_CATALOG
    value: auto
  - name: UC_SCHEMA
    value: analytics
  - name: READMISSION_ENDPOINT
    value: readmission-scorer
  - name: READMISSION_LIVE_SCORING
    value: "true"
